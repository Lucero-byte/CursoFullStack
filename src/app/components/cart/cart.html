<div class="card">
    <div class="card-content">
        <div class="card-header">
            <h5 class="card-title">Carro de compras!</h5>

        </div>
        <div class="card-body">

            @if (items.length > 0) {
                <table class="table table-hover table-striped">
                    <thead>
                        <tr>
                            <th>Producto</th>
                            <th>Precio</th>
                            <th>Cantidad</th>
                            <th>Total</th>
                            <th>Eliminar</th>
                        </tr>
                    </thead>

                    <tbody>
                        @for (item of items; track $index) {
                        <tr>
                            <th>{{item.product.name}}</th>
                            <th>{{item.product.price}}</th>
                            <th>{{item.quantity}}</th>
                            <th>{{item.product.price * item.quantity}}</th>
                            <td>
                                <button class="btn btn-danger btn-sm d-flex align-items-center gap-2"
                                    (click)="onDeleteCart(item.product.id)">
                                    <i class="bi bi-trash"></i>
                                    eliminar
                                </button>
                            </td>
                        </tr>
                        }
                    </tbody>
                    <tfoot>
                        <tr>
                            <td colspan="4" class="text-end fw-bold">Total</td>
                            <td colspan="1" class="text-start fw-bold">{{total}}</td>
                        </tr>
                    </tfoot>
                </table>
            } @else {
                <div class="alert alert-warning">El carro de compras esta vacio!</div>
            }
        </div>
    </div>
</div>
