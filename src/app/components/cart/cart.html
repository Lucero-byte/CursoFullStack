<table class="table table-hover table-striped">
    <thead>
        <tr>
            <th>Producto</th>
            <th>Precio</th>
            <th>Cantidad</th>
            <th>Total</th>
            <th>Eliminar</th>
        </tr>
    </thead>

    <tbody>
        @for (item of items; track $index) {
            <tr>
                <th>{{item.product.name}}</th>
                <th>{{item.product.price}}</th>
                <th>{{item.quantity}}</th>
                <th>{{item.product.price * item.quantity}}</th>
                <td>
                    <button class="btn btn-danger btn-sm d-flex align-items-center gap-2"
                    (click)="onDeleteCart(item.product.id)">
                    <i class="bi bi-trash"></i>
                        eliminar
                    </button>
                </td>
            </tr>
        }
    </tbody>
    <tfoot>
        <tr>
            <td colspan="4" class="text-end fw-bold">Total</td>
            <td colspan="1" class="text-start fw-bold">{{total}}</td>
        </tr>
    </tfoot>
</table>
